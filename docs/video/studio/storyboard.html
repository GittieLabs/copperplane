<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Cold open storyboard</title>
<style>
  html, body { margin: 0; background: #0A1410; }
  canvas { display: block; }
</style>
</head>
<body>
<canvas id="c" width="1080" height="1920"></canvas>
<script type="module">
// Storyboard frames for the cold open: ?morph=0..1&t=seconds&format=9x16.
import { drawColdOpen } from './src/coldopen.js';
import { layoutFor } from './src/layout.js';

const q = new URLSearchParams(location.search);
const L = layoutFor(q.get('format') || '9x16');
const c = document.getElementById('c');
c.width = L.W; c.height = L.H;
const ctx = c.getContext('2d');

async function fonts() {
  const base = './node_modules/@fontsource/ibm-plex-sans/files/ibm-plex-sans-latin';
  for (const w of [400, 600]) {
    document.fonts.add(await new FontFace('IBM Plex Sans', `url(${base}-${w}-normal.woff2)`, { weight: String(w) }).load());
  }
}

window.ready = fonts().then(() => {
  ctx.fillStyle = '#0A1410';
  ctx.fillRect(0, 0, L.W, L.H);
  drawColdOpen(ctx, L.media, Number(q.get('morph') || 0), Number(q.get('t') || 0));
  ctx.font = `600 ${Math.round(L.captionSize * 1.3)}px "IBM Plex Sans", sans-serif`;
  ctx.fillStyle = '#F4F7F3';
  ctx.textAlign = 'center';
  const text = q.get('text') || '';
  text.split('|').forEach((line, i) => ctx.fillText(line, L.W / 2, L.caption.y + L.captionSize * 1.3 * (i + 1)));
});
</script>
</body>
</html>
