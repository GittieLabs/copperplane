<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Copperplane</title>
    <!-- SPEC-317: applies the stored theme before first paint so the app
         never flashes dark before React mounts. Must match the storage key
         and value set in apps/tauri-ui/src/lib/theme.ts. -->
    <script>
      (function () {
        var pref = localStorage.getItem('theme-preference')
        if (pref === 'light' || pref === 'dark') {
          document.documentElement.setAttribute('data-theme', pref)
        }
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
