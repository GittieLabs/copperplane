name: "Docs site"

on:
  push:
    branches: [develop]
    paths:
      - 'docs/site/**'
      - '.github/workflows/docs.yml'
  workflow_dispatch:

# Least privilege: the deploy job needs Pages plus an OIDC token, nothing else.
permissions:
  contents: read
  pages: write
  id-token: write

# Never let two Pages deploys race. Deliberately does NOT cancel an in-flight
# run -- a half-deployed docs site is worse than a slightly stale one.
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: docs/site
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: docs/site/package-lock.json

      - run: npm ci

      - name: Build
        # Astro reports anonymous usage data by default. This project's whole
        # pitch is that nothing leaves your machine, so shipping a docs build
        # that phones home would be a poor look. Disabled explicitly.
        env:
          ASTRO_TELEMETRY_DISABLED: '1'
        run: npm run build

      - uses: actions/upload-pages-artifact@v5
        with:
          path: docs/site/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
