name: "Rust Core CI"

on:
  pull_request:
    branches: [ develop, main ]
    paths:
      - "core/tauri-rust/**"
      - ".github/workflows/rust-core-ci.yml"

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: core/tauri-rust
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      # Tauri links against WebKitGTK/GTK on Linux; these aren't
      # preinstalled on the runner image the way WebView2 (Windows) and
      # WKWebView (macOS) are.
      - name: Install Linux system dependencies
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf \
            libgtk-3-dev \
            libssl-dev

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: core/tauri-rust

      - name: cargo test
        run: cargo test --locked
