name: "Release"

# SPEC-402: a macOS release pipeline. CTX-402.1/.2 shipped it unsigned
# first, deliberately (see SPEC-402 §1 Non-Goals at the time). CTX-402.3
# added real signing and notarization once a real GittieLabs, LLC Apple
# Developer org account existed -- Team ID 834C8Q72TG. CTX-402.4 adds a
# real second build leg for Intel Macs (x86_64-apple-darwin), matrix-built
# alongside the existing Apple Silicon leg (aarch64-apple-darwin) on the
# SAME arm64 macos-latest runner rather than a separate hosted Intel
# runner -- GitHub's hosted Intel macOS runners are gated behind the paid
# Larger Runners offering today (confirmed directly against
# actions/runner-images' own current README, CTX-402.4), so this
# cross-compiles instead. KiCad/FreeCAD are never bundled by this app (both
# are resolved via PATH/glob against a separately-installed copy), so their
# own architecture support has no bearing on this build matrix. CTX-402.5
# adds real, UNSIGNED Windows and Linux builds -- explicitly pre-release
# (see SPEC-402 §1 Non-Goals): windows-latest/ubuntu-latest are free-tier
# GitHub-hosted runners (unlike macOS Intel), so no cross-compile trick is
# needed there, just their own native build legs. CTX-402.7: every `tauri
# build` invocation below pins an exact @tauri-apps/cli version
# (2.11.4, the one this pipeline last verified end to end) rather than
# `npx @tauri-apps/cli@2`, which silently resolves to whatever 2.x is
# newest at build time -- the real, root cause of CTX-402.6's Linux
# updater-artifact regression. Bump this version deliberately, verifying
# a real release run, not by letting it drift.

on:
  push:
    tags:
      - "v*"

jobs:
  build-macos:
    runs-on: macos-latest
    strategy:
      matrix:
        target: [aarch64-apple-darwin, x86_64-apple-darwin]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Verify the pushed tag matches Cargo.toml and tauri.conf.json's real versions
        run: python3 scripts/check_release_version.py "$GITHUB_REF_NAME"

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: core/tauri-rust
          key: ${{ matrix.target }}

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install frontend dependencies
        working-directory: apps/tauri-ui
        run: npm ci

      # The x86_64-apple-darwin leg needs Rosetta 2 to actually execute an
      # x86_64 Python interpreter for PyInstaller's freeze -- PyInstaller
      # can't cross-compile, it runs the target-arch interpreter directly
      # to introspect real imports. GitHub's arm64 macOS runner images do
      # not ship Rosetta pre-installed (confirmed directly against the
      # real, current runner-images README -- CTX-402.4 Plan Drift), so
      # it's installed explicitly here. A harmless no-op on the aarch64 leg.
      - name: Install Rosetta 2 (needed to run an x86_64 Python interpreter on this arm64 runner)
        if: matrix.target == 'x86_64-apple-darwin'
        run: softwareupdate --install-rosetta --agree-to-license

      # A single, real python.org universal2 3.11 framework build serves
      # BOTH matrix legs -- `arch -x86_64`/`arch -arm64` select the real
      # slice each leg's freeze needs (CTX-402.4's own real, local
      # end-to-end verification confirmed this works, including that
      # PYTHONFRAMEWORK is set under either slice, satisfying the same
      # framework-build requirement CTX-401.1 established). This replaces
      # the single-arch-only Homebrew install CTX-401.1/CTX-402.1 used
      # when only one architecture existed.
      - name: Install python.org's official universal2 Python 3.11 (framework build, required by PyInstaller)
        run: |
          curl -fsSL -o "$RUNNER_TEMP/python311.pkg" https://www.python.org/ftp/python/3.11.9/python-3.11.9-macos11.pkg
          sudo installer -pkg "$RUNNER_TEMP/python311.pkg" -target /

      - name: Install daemon runtime + build dependencies
        working-directory: services/python-daemon
        env:
          ARCH_PREFIX: ${{ matrix.target == 'x86_64-apple-darwin' && 'arch -x86_64' || 'arch -arm64' }}
        run: |
          $ARCH_PREFIX /Library/Frameworks/Python.framework/Versions/3.11/bin/python3.11 -m venv .build-venv
          $ARCH_PREFIX .build-venv/bin/pip install -r requirements.txt -r requirements-build.txt

      - name: Freeze the Python daemon (SPEC-401's committed daemon.spec)
        working-directory: services/python-daemon
        env:
          ARCH_PREFIX: ${{ matrix.target == 'x86_64-apple-darwin' && 'arch -x86_64' || 'arch -arm64' }}
        run: $ARCH_PREFIX .build-venv/bin/pyinstaller daemon.spec

      # Tauri's externalBin convention appends the real BUILD-TARGET's
      # triple to the sidecar's base name, not the build HOST's -- using
      # `rustc -vV`'s host field here (as the pre-CTX-402.4 single-arch
      # pipeline did) would silently name the x86_64 leg's real frozen
      # binary with the wrong (aarch64) suffix, since rustc's own host
      # triple never changes on this arm64 runner even when cross-
      # compiling. Keying off matrix.target directly is the real fix
      # (CTX-402.4 Plan Drift).
      - name: Rename the frozen binary to Tauri's real target-triple sidecar convention
        working-directory: services/python-daemon
        run: mv dist/hardware-agent-studio-daemon "dist/hardware-agent-studio-daemon-${{ matrix.target }}"

      # The App Store Connect API key (CTX-402.3) is stored as a GitHub
      # secret holding the real .p8 file *content* -- notarytool (invoked
      # internally by Tauri's own bundler) needs an actual file path, not
      # inline content, so it's written out here. Named APPLE_API_KEY_PATH
      # deliberately, not APPLE_API_KEY -- that name is reserved by
      # Tauri's own env-var contract for the short Key ID string itself
      # (confirmed by real, direct local testing -- see CTX-402.3 Plan
      # Drift), not the file's content or path.
      - name: Write the App Store Connect API key to a real file
        run: echo "${{ secrets.APPLE_API_KEY }}" > "$RUNNER_TEMP/AuthKey.p8"

      # tauri.macos.conf.json (CTX-401.2) merges automatically -- Tauri v2's
      # own platform-config-override convention picks it up because this
      # step runs on macOS, no explicit --config flag needed.
      # createUpdaterArtifacts now defaults to false (SPEC-406) so a
      # contributor's own local build never demands a signing key; this
      # release leg explicitly re-enables it via --config
      # tauri.release.conf.json (merged on top, per Tauri's own
      # "configs merge in the order provided" contract), which combined
      # with the two TAURI_SIGNING_* vars makes this step produce a real
      # <app>.app.tar.gz + matching .sig, signed with the real, maintainer-
      # generated Ed25519 keypair -- entirely unrelated to the
      # APPLE_*/Developer ID vars below (SPEC-402 §2: two separate trust
      # mechanisms, never conflated). The APPLE_* vars make Tauri's own
      # bundler codesign with the real GittieLabs Developer ID Application
      # certificate and notarize + staple via notarytool automatically --
      # confirmed for real via direct local testing (CTX-402.3): these
      # exact variable names are Tauri's own real, working contract, not
      # assumed from documentation. --target makes this a real explicit
      # cross-compile on both legs (CTX-402.4) -- Cargo always writes
      # output under target/<triple>/release/ once --target is passed
      # explicitly, even for the native architecture, so every path below
      # is target-triple-namespaced accordingly.
      - name: Build the Tauri app bundle
        working-directory: core/tauri-rust
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: "Developer ID Application: GittieLabs, LLC (834C8Q72TG)"
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_KEY_PATH: ${{ runner.temp }}/AuthKey.p8
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: npx @tauri-apps/cli@2.11.4 build --target ${{ matrix.target }} --config tauri.release.conf.json

      - name: Upload this leg's real build artifacts for the publish job
        uses: actions/upload-artifact@v4
        with:
          name: macos-${{ matrix.target }}
          path: |
            core/tauri-rust/target/${{ matrix.target }}/release/bundle/dmg/*.dmg
            core/tauri-rust/target/${{ matrix.target }}/release/bundle/macos/*.app.tar.gz
            core/tauri-rust/target/${{ matrix.target }}/release/bundle/macos/*.app.tar.gz.sig
          if-no-files-found: error

  # CTX-402.5: a real, unsigned, PRE-RELEASE Windows build. windows-latest
  # is a free-tier GitHub-hosted runner (unlike macOS Intel), so this is a
  # plain native build, no cross-compile trick needed. No APPLE_*-style
  # signing vars exist for Windows yet -- a real, separate, not-yet-made
  # decision (SPEC-402 §1 Non-Goals), so the .exe/.msi ship unsigned;
  # Windows SmartScreen will warn on first launch, documented in README.
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Verify the pushed tag matches Cargo.toml and tauri.conf.json's real versions
        shell: bash
        run: python3 scripts/check_release_version.py "$GITHUB_REF_NAME"

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: core/tauri-rust
          key: x86_64-pc-windows-msvc

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install frontend dependencies
        working-directory: apps/tauri-ui
        run: npm ci

      # Unlike macOS, PyInstaller has no shared-library/framework-build
      # requirement on Windows -- a standard actions/setup-python CPython
      # freezes directly, no special interpreter sourcing needed (real
      # dependency wheel availability for every requirements.txt/
      # requirements-build.txt package on win_amd64/cp311 was confirmed
      # directly against PyPI before writing this job -- CTX-402.5).
      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install daemon runtime + build dependencies
        shell: bash
        working-directory: services/python-daemon
        run: |
          python -m venv .build-venv
          .build-venv/Scripts/pip install -r requirements.txt -r requirements-build.txt

      - name: Freeze the Python daemon (SPEC-401's committed daemon.spec)
        shell: bash
        working-directory: services/python-daemon
        run: .build-venv/Scripts/pyinstaller daemon.spec

      # PyInstaller already names its Windows output with a real .exe
      # extension; Tauri's externalBin convention still needs the real
      # target-triple suffix inserted before that extension (CTX-402.5).
      - name: Rename the frozen binary to Tauri's real target-triple sidecar convention
        shell: bash
        working-directory: services/python-daemon
        run: mv dist/hardware-agent-studio-daemon.exe dist/hardware-agent-studio-daemon-x86_64-pc-windows-msvc.exe

      # tauri.windows.conf.json (CTX-402.5) merges automatically on this
      # runner. No APPLE_*-equivalent signing vars -- only the Tauri
      # updater keypair, shared across every platform (SPEC-402 §2: the
      # updater's own trust model was always platform-agnostic).
      # --config tauri.release.conf.json (SPEC-406) re-enables
      # createUpdaterArtifacts for this release leg -- see the macOS leg's
      # comment above for the full reasoning.
      - name: Build the Tauri app bundle
        working-directory: core/tauri-rust
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: npx @tauri-apps/cli@2.11.4 build --target x86_64-pc-windows-msvc --config tauri.release.conf.json

      - name: Upload this leg's real build artifacts for the publish job
        uses: actions/upload-artifact@v4
        with:
          name: windows-x86_64-pc-windows-msvc
          path: |
            core/tauri-rust/target/x86_64-pc-windows-msvc/release/bundle/msi/*.msi
            core/tauri-rust/target/x86_64-pc-windows-msvc/release/bundle/nsis/*.exe
            core/tauri-rust/target/x86_64-pc-windows-msvc/release/bundle/nsis/*.sig
          if-no-files-found: error

  # CTX-402.5: a real, unsigned, PRE-RELEASE Linux build. ubuntu-latest is
  # a free-tier GitHub-hosted runner. --bundles deb,appimage deliberately
  # excludes rpm -- ubuntu-latest has no rpmbuild installed, and .deb +
  # .AppImage already cover the large majority of desktop Linux users;
  # adding an unverified rpmbuild dependency wasn't worth it for this
  # pre-release pass (CTX-402.5 Plan Drift). Linux has no OS-level signing
  # concept equivalent to Gatekeeper/SmartScreen for this distribution
  # method, so there's no unsigned-launch warning to document here.
  build-linux:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Verify the pushed tag matches Cargo.toml and tauri.conf.json's real versions
        run: python3 scripts/check_release_version.py "$GITHUB_REF_NAME"

      # Tauri links against WebKitGTK/GTK on Linux; these aren't
      # preinstalled on the runner image the way WebView2 (Windows) and
      # WKWebView (macOS) are (same real package list rust-core-ci.yml's
      # own Linux leg already uses successfully).
      - name: Install Linux system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf \
            libgtk-3-dev \
            libssl-dev

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: core/tauri-rust
          key: x86_64-unknown-linux-gnu

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install frontend dependencies
        working-directory: apps/tauri-ui
        run: npm ci

      # Same real reasoning as the Windows leg: no shared-library/
      # framework-build requirement on Linux, a standard actions/setup-
      # python CPython freezes directly. Every requirements.txt/
      # requirements-build.txt dependency's manylinux_2_28_x86_64/cp311
      # wheel availability was confirmed directly against PyPI before
      # writing this job (CTX-402.5).
      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install daemon runtime + build dependencies
        working-directory: services/python-daemon
        run: |
          python -m venv .build-venv
          .build-venv/bin/pip install -r requirements.txt -r requirements-build.txt

      - name: Freeze the Python daemon (SPEC-401's committed daemon.spec)
        working-directory: services/python-daemon
        run: .build-venv/bin/pyinstaller daemon.spec

      - name: Rename the frozen binary to Tauri's real target-triple sidecar convention
        working-directory: services/python-daemon
        run: mv dist/hardware-agent-studio-daemon dist/hardware-agent-studio-daemon-x86_64-unknown-linux-gnu

      # tauri.linux.conf.json (CTX-402.5) merges automatically on this
      # runner. --config tauri.release.conf.json (SPEC-406) re-enables
      # createUpdaterArtifacts for this release leg (see the macOS leg's
      # comment above). AppImage is the real Linux updater artifact
      # format, not .deb/.rpm (CTX-402.5, still true). CTX-402.6: the real
      # v0.2.0 release run showed the current @tauri-apps/cli (2.11.4,
      # resolved fresh by npx, not pinned) signs the raw
      # <app>_<version>_amd64.AppImage directly -- ".AppImage.sig", no
      # ".tar.gz" wrapper -- unlike the ".app.tar.gz"/".sig" pair macOS
      # still produces. CTX-402.5's own comment assumed the .tar.gz
      # wrapper from whatever Tauri version was current in 2026-08-17;
      # this is real, observed version drift, not a mistake in this leg's
      # own build step -- only the two download-side glob patterns below
      # (and the matching ones in the publish job) needed correcting.
      - name: Build the Tauri app bundle
        working-directory: core/tauri-rust
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: npx @tauri-apps/cli@2.11.4 build --target x86_64-unknown-linux-gnu --bundles deb,appimage --config tauri.release.conf.json

      - name: Upload this leg's real build artifacts for the publish job
        uses: actions/upload-artifact@v4
        with:
          name: linux-x86_64-unknown-linux-gnu
          path: |
            core/tauri-rust/target/x86_64-unknown-linux-gnu/release/bundle/deb/*.deb
            core/tauri-rust/target/x86_64-unknown-linux-gnu/release/bundle/appimage/*.AppImage
            core/tauri-rust/target/x86_64-unknown-linux-gnu/release/bundle/appimage/*.AppImage.sig
          if-no-files-found: error

  # A separate job, not a third matrix leg: publishing must happen exactly
  # once, after every real build leg has finished, so the GitHub Release
  # and latest.json each carry every real artifact together rather than
  # one job racing to publish a partial release (CTX-402.4, extended by
  # CTX-402.5 to also wait on Windows/Linux).
  publish:
    needs: [build-macos, build-windows, build-linux]
    runs-on: macos-latest
    steps:
      # CTX-402.7: fetch-depth: 0 (full history, every tag) -- the default
      # shallow checkout (depth 1) made generate_release_notes.py's own
      # fallback (first_commit(), when no other tag is found) silently
      # treat this single fetched commit as the repo's root, comparing
      # v0.2.0 against itself and reporting a null diff. Needed regardless
      # of latest_tag()'s own fix, since a real from_ref..to_ref diff
      # needs real history to walk.
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download every real build leg's artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Generate release notes from CTX-*.md implementation logs
        run: python3 scripts/generate_release_notes.py --to-ref "$GITHUB_REF_NAME" > "$RUNNER_TEMP/release-notes.md"

      # Four real --platform groups, one per real, independently-built
      # leg (two macOS architectures signed/notarized -- CTX-402.4 --
      # plus unsigned Windows/Linux pre-release builds -- CTX-402.5) --
      # generate_update_manifest.py folds them all into one latest.json.
      # Each platform's find -name '*.sig' relies on exactly one .sig
      # file existing in that leg's downloaded artifact directory -- true
      # for Windows (only the .exe's .sig is ever uploaded, see that leg's
      # own upload step) and, since CTX-402.6, true for Linux too (only
      # the AppImage's .sig is uploaded, not the .deb's).
      - name: Generate the real Tauri updater manifest (latest.json)
        run: |
          PUB_DATE=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          AARCH64_SIG=$(find artifacts/macos-aarch64-apple-darwin -name '*.app.tar.gz.sig')
          AARCH64_TARBALL=$(basename "${AARCH64_SIG%.sig}")
          X86_64_SIG=$(find artifacts/macos-x86_64-apple-darwin -name '*.app.tar.gz.sig')
          X86_64_TARBALL=$(basename "${X86_64_SIG%.sig}")
          WINDOWS_SIG=$(find artifacts/windows-x86_64-pc-windows-msvc -name '*.sig')
          WINDOWS_ARTIFACT=$(basename "${WINDOWS_SIG%.sig}")
          LINUX_SIG=$(find artifacts/linux-x86_64-unknown-linux-gnu -name '*.sig')
          LINUX_ARTIFACT=$(basename "${LINUX_SIG%.sig}")
          python3 scripts/generate_update_manifest.py \
            --version "$GITHUB_REF_NAME" \
            --pub-date "$PUB_DATE" \
            --notes-file "$RUNNER_TEMP/release-notes.md" \
            --platform aarch64-apple-darwin "$AARCH64_SIG" \
              "https://github.com/${{ github.repository }}/releases/download/${GITHUB_REF_NAME}/${AARCH64_TARBALL}" \
            --platform x86_64-apple-darwin "$X86_64_SIG" \
              "https://github.com/${{ github.repository }}/releases/download/${GITHUB_REF_NAME}/${X86_64_TARBALL}" \
            --platform x86_64-pc-windows-msvc "$WINDOWS_SIG" \
              "https://github.com/${{ github.repository }}/releases/download/${GITHUB_REF_NAME}/${WINDOWS_ARTIFACT}" \
            --platform x86_64-unknown-linux-gnu "$LINUX_SIG" \
              "https://github.com/${{ github.repository }}/releases/download/${GITHUB_REF_NAME}/${LINUX_ARTIFACT}" \
            > "$RUNNER_TEMP/latest.json"

      - name: Publish the GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          body_path: ${{ runner.temp }}/release-notes.md
          files: |
            artifacts/macos-aarch64-apple-darwin/**/*.dmg
            artifacts/macos-aarch64-apple-darwin/**/*.app.tar.gz
            artifacts/macos-aarch64-apple-darwin/**/*.app.tar.gz.sig
            artifacts/macos-x86_64-apple-darwin/**/*.dmg
            artifacts/macos-x86_64-apple-darwin/**/*.app.tar.gz
            artifacts/macos-x86_64-apple-darwin/**/*.app.tar.gz.sig
            artifacts/windows-x86_64-pc-windows-msvc/**/*.msi
            artifacts/windows-x86_64-pc-windows-msvc/**/*.exe
            artifacts/windows-x86_64-pc-windows-msvc/**/*.sig
            artifacts/linux-x86_64-unknown-linux-gnu/**/*.deb
            artifacts/linux-x86_64-unknown-linux-gnu/**/*.AppImage
            artifacts/linux-x86_64-unknown-linux-gnu/**/*.AppImage.sig
            ${{ runner.temp }}/latest.json
