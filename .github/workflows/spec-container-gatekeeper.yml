name: "Spec & Context Validation"

on:
  pull_request:
    branches: [ develop, main ]
    types: [ opened, synchronize, reopened, labeled, unlabeled ]

jobs:
  validate-specs-and-context:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
      issues: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0 # Full depth required to calculate git diffs against target branch

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyyaml

      # Labels are read live, not from github.event.pull_request.labels: the
      # event payload is a snapshot from when the event fired. Dependabot
      # opens a PR and applies 'trivial-fix' a second later, so the `opened`
      # run's payload can carry no labels at all and fail while the
      # `labeled` runs beside it pass (PR #491). By the time this step runs
      # the labels are on the PR, whichever event started the run.
      - name: Run Spec & Context Validator
        env:
          BASE_REF: ${{ github.base_ref }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          GH_TOKEN: ${{ github.token }}
        run: |
          PR_LABELS=$(gh api "repos/$GITHUB_REPOSITORY/issues/$PR_NUMBER/labels" --jq '[.[].name] | join(",")')
          echo "PR labels: ${PR_LABELS:-<none>}"
          python scripts/validate_spec_context.py --base origin/$BASE_REF --labels "$PR_LABELS"