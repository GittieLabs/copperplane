name: "Spec & Context Validation"

on:
  pull_request:
    branches: [ develop, main ]
    types: [ opened, synchronize, reopened, labeled, unlabeled ]

jobs:
  validate-specs-and-context:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Full depth required to calculate git diffs against target branch

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyyaml

      - name: Run Spec & Context Validator
        env:
          BASE_REF: ${{ github.base_ref }}
          PR_LABELS: ${{ join(github.event.pull_request.labels.*.name, ',') }}
        run: |
          python scripts/validate_spec_context.py --base origin/$BASE_REF --labels "$PR_LABELS"