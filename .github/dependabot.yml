# CTX-209.1 §4 Deviation 4 asked for this: pinning stops a release from
# silently acquiring an incompatible dependency, but pins do not move
# themselves, and nothing here prompted anyone to look. Every update now
# arrives as a PR the existing checks run against, so a bump becomes a
# reviewed, tested event rather than whatever pip or npm resolved that
# morning.
#
# GROUPED, one PR per ecosystem per week. The first configuration opened
# one PR per package and 25 landed in an afternoon -- each burning a full
# macOS/Windows/Ubuntu CI run, and collectively creating exactly the
# pressure that gets things merged without being read. #317 is what that
# costs: cryptography was bumped past a boundary CTX-402.6 had pinned it
# below, breaking Intel macOS releases, and merged with the explanatory
# comment still sitting directly above it.
#
# Majors are separated rather than ignored. A major bump is usually the
# one worth having -- actions/checkout 4->7 is what clears the Node 20
# deprecation warning on every release leg -- but it should be read, not
# swept along with a patch bump. Minor and patch group together; majors
# arrive on their own so a breaking change cannot hide in a batch.
version: 2
updates:
  - package-ecosystem: "pip"
    directory: "/services/python-daemon"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 3
    commit-message:
      prefix: "chore(deps)"
    groups:
      python-minor-and-patch:
        applies-to: version-updates
        update-types: ["minor", "patch"]
    ignore:
      # cryptography dropped macOS x86_64 wheels entirely at 49.0.0 -- from
      # there on only macosx_11_0_arm64 ships. 48.0.0 is the newest release
      # carrying a real macosx_10_9_universal2 wheel, which is what the
      # x86_64 macOS release leg needs; without it pip builds from source
      # and PyInstaller's own arch check rejects the arm64-only .so.
      # CTX-402.6 found that through a real failed CI run (v0.1.3), and
      # release.yml fires only on a pushed tag -- so nothing catches a
      # regression here until a release is already going out.
      #
      # This ignore exists because that is exactly what happened: #317
      # bumped it to 50.0.1 and it merged. Re-checked against PyPI on
      # 2026-09-01: still arm64-only at 50.0.1. Revisit only when
      # cryptography ships an x86_64 or universal2 macOS wheel again, or
      # when SPEC-402 stops building an Intel macOS leg.
      #
      # Deliberately the ONLY ignored package. anthropic, openai and
      # google-genai stay open even though CTX-209.1 pinned them after a
      # floating SDK shipped a broken v0.3.0 -- those bumps are verifiable
      # by the test suite and a release, so they should be proposed and
      # reviewed. cryptography is different in kind: no check in this repo
      # can see its breakage, which is what earns a rule instead of a
      # reviewer's memory.
      - dependency-name: "cryptography"
    labels:
      - "dependencies"
      # The spec/context gatekeeper blocks any code change without a
      # CTX-*.md. A dependency bump has no design to record, and CTX-902.3
      # added this label for exactly that case -- without it every
      # Dependabot PR fails a gate it can never satisfy.
      - "trivial-fix"

  - package-ecosystem: "npm"
    directory: "/apps/tauri-ui"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 3
    commit-message:
      prefix: "chore(deps)"
    groups:
      frontend-minor-and-patch:
        applies-to: version-updates
        update-types: ["minor", "patch"]
    labels:
      - "dependencies"
      - "trivial-fix"

  - package-ecosystem: "cargo"
    directory: "/core/tauri-rust"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 3
    commit-message:
      prefix: "chore(deps)"
    groups:
      rust-minor-and-patch:
        applies-to: version-updates
        update-types: ["minor", "patch"]
    labels:
      - "dependencies"
      - "trivial-fix"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 3
    commit-message:
      prefix: "chore(ci)"
    groups:
      actions-minor-and-patch:
        applies-to: version-updates
        update-types: ["minor", "patch"]
    labels:
      - "dependencies"
      - "trivial-fix"
